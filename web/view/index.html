<!DOCTYPE html>
<html>
<head> 
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>爱家</title>
    <link href="./plugins/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="./plugins/font-awesome/css/font-awesome.min.css" rel="stylesheet">
    <link href="./css/reset.css" rel="stylesheet">
    <link href="./plugins/swiper/css/swiper.css" rel="stylesheet">
    <link href="./plugins/bootstrap-datepicker/css/bootstrap-datepicker.min.css" rel="stylesheet">
    <link href="./css/ihome/main.css" rel="stylesheet">
    <link href="./css/ihome/index.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="site-header">
            <a class="site-logo" href="/home/index.html"><img src="./images/logo@128x59.png" alt="爱家"></a>
            <div class="site-header-right">
                <div class="register-login">
                    <a class="btn top-btn btn-theme" href="/home/login.html">登录</a>
                    <a class="btn top-btn btn-theme" href="/home/register.html">注册</a>
                </div>
                <div class="user-info"><span><i class="fa fa-user fa-lg"></i></span> <a class="user-name" href="/home/my.html"></a></div>
            </div>
        </div>
        <div class="swiper-container">
            <div class="swiper-wrapper">
            </div>
            <div class="swiper-pagination"></div>
            <div class="swiper-empty" style="display:none;">暂无推荐房源，请直接搜索</div>
        </div>
        <script id="swiper-houses-tmpl" type="text/html">
            {{each houses as house}}
            <div class="swiper-slide">
                <a href="/home/detail.html?id={{house.house_id}}">
                    <img src="{{house.img_url}}" alt="{{house.title}}">
                </a>
                <div class="slide-title">
                    <span class="slide-name">{{house.title}}</span>
                    <span class="slide-price">￥{{house.price}}/晚</span>
                </div>
            </div>
            {{/each}}
        </script>
        <div class="search-bar">
            <button class="filter-btn" type="button" data-toggle="modal" data-target="#area-modal"><span class="fl" id="area-btn">选择城区</span><span class="fr"><i class="fa fa-map-marker fa-lg fa-fw"></i></span></button>
            <button class="filter-btn" type="button" data-toggle="modal" data-target="#start-date-modal"><span class="fl" id="start-date-btn">入住日期</span><span class="fr"><i class="fa fa-calendar fa-lg fa-fw"></i></span></button>
            <button class="filter-btn end-date" type="button" data-toggle="modal" data-target="#end-date-modal"><span class="fl" id="end-date-btn">离开日期</span><span class="fr"><i class="fa fa-calendar fa-lg fa-fw"></i></span></button>
            <a class="btn search-btn btn-theme" href="/home/search.html" onclick="goToSearchPage(this);" area-id="" start-date="" end-date="">搜索</a>
            <div class="modal fade" id="area-modal" tabindex="-1" role="dialog" aria-labelledby="area-label">
                <div class="modal-dialog" role="document">
                    <div class="modal-content">
                        <div class="modal-header">
                            <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                            <h4 class="modal-title" id="area-label">选择城区</h4>
                        </div>
                        <div class="modal-body">
                            <div class="area-list">
                            </div>
                            <script id="area-list-tmpl" type="text/html">
                            {{each areas as area}}
                                <a href="#" area-id="{{area.aid}}">{{area.aname}}</a>
                            {{/each}}
                            </script>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal fade" id="start-date-modal" tabindex="-1" role="dialog" aria-labelledby="start-date-label">
                <div class="modal-dialog" role="document">
                    <div class="modal-content">
                        <div class="modal-header">
                            <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                            <h4 class="modal-title" id="start-date-label">入住日期</h4>
                        </div>
                        <div class="modal-body">
                            <div class="date-select" id="start-date"></div>
                            <input type="hidden" id="start-date-input">
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-theme" onclick="setStartDate();">确定</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal fade" id="end-date-modal" tabindex="-1" role="dialog" aria-labelledby="end-date-label">
                <div class="modal-dialog" role="document">
                    <div class="modal-content">
                        <div class="modal-header">
                            <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                            <h4 class="modal-title" id="end-date-label">离开日期</h4>
                        </div>
                        <div class="modal-body">
                            <div class="date-select" id="end-date"></div>
                            <input type="hidden" id="end-date-input">
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-theme" onclick="setEndDate();">确定</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="hot-areas-section">
            <div class="section-title">热门城区</div>
            <div class="hot-area-list"></div>
            <script id="hot-area-tmpl" type="text/html">
            {{each areas as area}}
                <a href="javascript:;" class="hot-area-tag" area-id="{{area.aid}}" area-name="{{area.aname}}">{{area.aname}}</a>
            {{/each}}
            </script>
        </div>
        <div class="latest-houses-section">
            <div class="section-title">最新房源</div>
            <ul class="latest-house-list"></ul>
            <div class="latest-empty" style="display:none;">暂无房源</div>
            <script id="latest-houses-tmpl" type="text/html">
            {{each houses as house}}
            <li class="latest-house-item">
                <a href="/home/detail.html?id={{house.house_id}}">
                    <img src="{{house.img_url}}" alt="{{house.title}}">
                    <div class="latest-house-info">
                        <div class="latest-house-title">{{house.title}}</div>
                        <div class="latest-house-meta">{{house.area_name}} · {{house.room_count}}室</div>
                        <div class="latest-house-price">￥<span>{{house.price}}</span>/晚</div>
                    </div>
                </a>
            </li>
            {{/each}}
            </script>
        </div>
        <div class="quick-nav" style="display:none;">
            <a href="/home/my.html">个人中心</a>
            <a href="/home/orders.html">我的订单</a>
            <a href="/home/newhouse.html">发布房源</a>
        </div>
        <div class="footer">
            <p><span><i class="fa fa-copyright"></i></span>爱家租房&nbsp;&nbsp;享受家的温馨</p>
        </div>
    </div>
    
    <script src="./js/jquery.min.js"></script>
    <script src="./plugins/bootstrap/js/bootstrap.min.js"></script>
    <script src="./plugins/swiper/js/swiper.jquery.min.js"></script>
    <script src="./plugins/bootstrap-datepicker/js/bootstrap-datepicker.min.js"></script>
    <script src="./plugins/bootstrap-datepicker/locales/bootstrap-datepicker.zh-CN.min.js"></script>
    <script src="./js/template.js"></script>
    <script src="./js/ihome/site-header.js"></script>
    <script src="./js/ihome/index.js"></script>
</body>
</html>
